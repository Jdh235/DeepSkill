job_name: GLM-4.5-Air-FP8
jobs_dir: results/no-skills
n_attempts: 3
timeout_multiplier: 2.5
environment_build_timeout_multiplier: 3.0
orchestrator:
  type: local
  n_concurrent_trials: 12
  retry:
    max_retries: 2
    exclude_exceptions:
      - AgentTimeoutError
      - RewardFileEmptyError
      - RewardFileNotFoundError
      - VerifierOutputParseError
      - VerifierTimeoutError
    wait_multiplier: 1.0
    min_wait_sec: 1.0
    max_wait_sec: 180.0
environment:
  type: docker
  force_build: false
  delete: false
agents:
  - name: terminus-2
    model_name: openai/zai-org/GLM-4.5-Air-FP8
    kwargs:
      api_base: http://localhost:8000/v1
      llm_kwargs:
        max_tokens: 8192
      model_info:
        max_input_tokens: 65536
datasets:
  - path: tasks-no-skills
